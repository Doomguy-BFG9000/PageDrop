services:
  worker:
    build:
      context: ./server/worker
      dockerfile: ../docker/Dockerfile
    environment:
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      POLL_INTERVAL: "${POLL_INTERVAL:-5}"
      MAX_CONCURRENT: "${MAX_CONCURRENT:-1}"
      JOB_TIMEOUT: "${JOB_TIMEOUT:-300}"
      RETENTION_HOURS: "${RETENTION_HOURS:-24}"
      CLEANUP_INTERVAL: "${CLEANUP_INTERVAL:-600}"
    restart: unless-stopped
    mem_limit: "${WORKER_MEMORY_LIMIT:-3g}"
    cpus: "${WORKER_CPU_LIMIT:-1.0}"
    # Calibre runs as an unprivileged user inside the container; nothing may regain
    # privileges through setuid binaries, and a fork bomb hits this cap, not the host.
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 512
    # No published ports: the health endpoint is only used by the healthcheck below,
    # which runs inside the container.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - pagedrop-artifacts:/tmp/pagedrop-artifacts

volumes:
  pagedrop-artifacts:
