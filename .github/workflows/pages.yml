name: Website

# Publishes website/ to GitHub Pages. Manual only for now: run it from the
# Actions tab once Pages is enabled (Settings → Pages → Source: GitHub Actions).
# The site lives at https://spandan-kumar.github.io/PageDrop/ (project site, no
# CNAME). Pages link to each other with relative paths; canonical, og:url,
# og:image and sitemap.xml use that absolute URL. The step below refuses to
# publish if the old placeholder domain pagedrop.example ever reappears.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refuse to publish the placeholder domain
        run: |
          if grep -rq 'pagedrop.example' website; then
            echo "::error::website/ still uses the placeholder domain pagedrop.example"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
