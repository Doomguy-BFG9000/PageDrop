name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PAGEDROP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "PAGEDROP_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PAGEDROP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          PAGEDROP_KEYSTORE_PASSWORD: ${{ secrets.PAGEDROP_KEYSTORE_PASSWORD }}
          PAGEDROP_KEY_ALIAS: ${{ secrets.PAGEDROP_KEY_ALIAS }}
          PAGEDROP_KEY_PASSWORD: ${{ secrets.PAGEDROP_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK, write checksum and release notes
        run: |
          mkdir -p dist
          APK="dist/PageDrop-${{ github.ref_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd dist && sha256sum "PageDrop-${{ github.ref_name }}.apk" > "PageDrop-${{ github.ref_name }}.apk.sha256")
          CODE=$(grep -E 'versionCode *=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          if [ -f "fastlane/metadata/android/en-US/changelogs/${CODE}.txt" ]; then
            cp "fastlane/metadata/android/en-US/changelogs/${CODE}.txt" release-notes.md
          else
            : > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PageDrop-${{ github.ref_name }}.apk
            dist/PageDrop-${{ github.ref_name }}.apk.sha256
          body_path: release-notes.md
          generate_release_notes: true
